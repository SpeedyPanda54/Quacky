<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quacky | Flappy Duck</title>
    <link rel="stylesheet" href="flappybird.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Permanent Arcade Marquee Header - Moved OUT of game-container -->
    <div id="game-header">
        <h1><a href="/index.html" class="home-link">Quacky Arcade</a></h1>
    </div>

    <div id="game-container">
        <canvas id="board"></canvas>

        <div id="score-display">
            <span id="current-score">0</span>
        </div>

        <div id="countdown-display" class="game-overlay hidden"></div>

        <div id="start-screen" class="game-overlay">
            <h1>Flappy Duck</h1>
            <div class="difficulty-buttons">
                <button id="difficulty-Beginner" class="difficulty-button active">Beginner</button>
                <button id="difficulty-Advanced" class="difficulty-button">Advanced</button>
                <button id="difficulty-Expert" class="difficulty-button">Expert</button>
            </div>
            <p>Press Space to Start</p>
            <div class="score-info">
                High Score (<span id="high-score-difficulty">Advanced</span>): <span id="high-score-value">0</span>
            </div>
        </div>

        <div id="game-over-screen" class="game-overlay hidden">
            <h1>Game Over!</h1>
            <p>Score: <span id="final-score-value">0</span></p>
            <p>High Score (<span id="final-high-score-difficulty">Advanced</span>): <span id="final-high-score-value">0</span></p>

            <!-- Global Score Submission & Leaderboard Section -->
            <div id="score-submission" style="margin: 5px 0;">
                <input type="text" id="player-name" placeholder="Enter Name" maxlength="25" style="padding: 5px; font-family: 'Press Start 2P'; font-size: 0.6em; width: 140px;">
                <button id="submit-score-btn" style="padding: 6px 10px; font-size: 0.6em; margin: 0;">Submit</button>
            </div>

            <h3 style="font-size: 0.7em; margin: 8px 0;">Global Top 5</h3>
            <ul id="leaderboard-list" style="font-size: 0.55em; text-align: left; list-style-type: none; padding: 0; margin: 0 0 10px 0; max-height: 80px; overflow-y: auto; width: 80%;">
                <li>Loading scores...</li>
            </ul>

            <div class="difficulty-buttons">
                <button id="difficulty-Beginner" class="difficulty-button active">Beginner</button>
                <button id="difficulty-Advanced" class="difficulty-button">Advanced</button>
                <button id="difficulty-Expert" class="difficulty-button">Expert</button>
            </div>

            <button id="restart-button">Play Again</button>
        </div>
    </div>

    <script type="module" src="flappybird.js"></script>
</body>
</html>
