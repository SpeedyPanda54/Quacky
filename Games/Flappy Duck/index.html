<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quacky | Flappy Duck</title>
    <link rel="stylesheet" href="flappybird.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%234fc3f7' stroke='%23ffffff' stroke-width='3'/><circle cx='32' cy='34' r='16' fill='%23FFD700'/><path d='M 46 32 C 52 32, 54 35, 46 38 Z' fill='%23FF8C00'/><circle cx='38' cy='28' r='2.5' fill='%23000000'/><circle cx='39' cy='27' r='0.8' fill='%23ffffff'/></svg>">
</head>
<body>
    <div id="game-container">
        <canvas id="board"></canvas>

        <div id="score-display">
            <span id="current-score">0</span>
        </div>

        <div id="countdown-display" class="game-overlay hidden"></div>

        <div id="start-screen" class="game-overlay">
            <h1>Flappy Duck</h1>
            <div class="difficulty-buttons">
                <button id="difficulty-Beginner" class="difficulty-button active">Beginner</button>
                <button id="difficulty-Advanced" class="difficulty-button">Advanced</button>
                <button id="difficulty-Expert" class="difficulty-button">Expert</button>
            </div>
            <p>Press Space to Start</p>
            <div class="score-info">
                High Score (<span id="high-score-difficulty">Advanced</span>): <span id="high-score-value">0</span>
            </div>
        </div>

       <div id="game-over-screen" class="game-overlay" style="display: none;">
    <h1>Game Over!</h1>
    <p>Score: <span id="final-score-value">0</span></p>
    
    <p style="font-size: 0.8em; margin: 5px 0;">
        High Score (<span id="final-high-score-difficulty">Advanced</span>): <span id="final-high-score-value">0</span>
    </p>

    <!-- High Score Submission Form -->
    <div id="score-submit-area" class="mb-3">
        <input type="text" id="player-name" placeholder="Enter Name" maxlength="25" class="form-control form-control-sm text-center mb-2" style="font-family: 'Press Start 2P'; font-size: 0.6em; width: 200px; display: inline-block;">
        <br>
        <button id="submit-score-btn" class="btn btn-primary btn-sm fw-bold px-3 py-1" style="font-family: 'Press Start 2P'; font-size: 0.5em;">Save Score</button>
    </div>

    <!-- Leaderboard List -->
    <div id="leaderboard-container" class="mb-3 bg-dark border border-success p-2 rounded" style="width: 250px; font-size: 0.5em;">
        <p class="text-success fw-bold mb-1">-- TOP HIGH SCORES --</p>
        <ol id="leaderboard-list" class="text-start ps-3 mb-0 text-white">
            <li>Loading...</li>
        </ol>
    </div>

    <button id="restart-button" class="btn btn-success fw-bold px-4 py-2">Play Again</button>
</div>
    </div>
    <script src="../../QuackyTitle.js"></script>
    <script type="module" src="flappybird.js"></script>
</body>
</html>
