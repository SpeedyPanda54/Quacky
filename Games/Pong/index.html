<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quacky | Pong</title>
    <link rel="stylesheet" href="pong.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%234fc3f7' stroke='%23ffffff' stroke-width='3'/><circle cx='32' cy='34' r='16' fill='%23FFD700'/><path d='M 46 32 C 52 32, 54 35, 46 38 Z' fill='%23FF8C00'/><circle cx='38' cy='28' r='2.5' fill='%23000000'/><circle cx='39' cy='27' r='0.8' fill='%23ffffff'/></svg>">
</head>
<body>
    <!-- Mode Switch & Room Controls -->
    <div class="controls-bar">
        <button id="mode-toggle-btn">Switch to Online Mode</button>
        <button id="reset-room-btn">Reset Online Room</button>
    </div>

    <div class="game-container">
        <h1>Pong 🏓</h1>
        <h2 id="status">Local 2P: P1 (W/S) | P2 (Up/Down)</h2>
        
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <button id="reset-btn">Restart Match</button>
    </div>

    <!-- Firebase SDKs for Online Mode -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- Reusable Quacky Header & Pong Logic -->
    <script src="/QuackyTitle.js"></script>
    <script src="pong.js"></script>
</body>
</html>
