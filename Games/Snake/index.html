<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quacky | Snake</title>
    <link href="../../bootstrap-5.3.3-dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="snake.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-dark text-white align-items-center justify-content-center m-0 p-0">

    <!-- Permanent Arcade Marquee Header -->
    <div id="game-header" class="w-100 text-center py-3 mb-4 bg-black bg-opacity-75 border-bottom border-success border-2">
        <h1 class="fs-4 m-0"><a href="../../index.html" class="home-link text-success text-decoration-none">Quacky</a></h1>
    </div>

    <div id="game-container" class="position-relative border border-4 border-white shadow-lg bg-black">
        <canvas id="board"></canvas>

        <div id="score-display" class="position-absolute top-0 start-0 p-2 fs-6 text-white" style="text-shadow: 2px 2px #000;">
            Score: <span id="current-score">0</span>
        </div>

        <div id="start-screen" class="game-overlay position-absolute top-0 start-0 w-100 h-100 bg-black bg-opacity-75 d-flex flex-column align-items-center justify-content-center text-center">
            <h1 class="text-success mb-3 fs-2" style="text-shadow: 3px 3px #000;">Snake</h1>
            <p class="fs-6 mb-3">Press Arrow Keys or WASD to Start</p>
            <p class="fs-7 text-muted">Press 'B' to take a preview screenshot</p>
        </div>

        <div id="game-over-screen" class="game-overlay position-absolute top-0 start-0 w-100 h-100 bg-black bg-opacity-75 d-flex flex-column align-items-center justify-content-center text-center hidden">
    <h1 class="text-danger mb-2 fs-2" style="text-shadow: 3px 3px #000;">Game Over!</h1>
    <p class="fs-6 mb-2">Score: <span id="final-score-value">0</span></p>

    <!-- High Score Submission Form -->
    <div id="score-submit-area" class="mb-3">
        <input type="text" id="player-name" placeholder="Enter Name" maxlength="25" class="form-control form-control-sm text-center mb-2" style="font-family: 'Press Start 2P'; font-size: 0.6em; width: 200px; display: inline-block;">
        <br>
        <button id="submit-score-btn" class="btn btn-primary btn-sm fw-bold px-3 py-1" style="font-family: 'Press Start 2P'; font-size: 0.5em;">Save Score</button>
    </div>

    <!-- Leaderboard List -->
    <div id="leaderboard-container" class="mb-3 bg-dark border border-success p-2 rounded" style="width: 250px; font-size: 0.5em;">
        <p class="text-success fw-bold mb-1">-- TOP HIGH SCORES --</p>
        <ol id="leaderboard-list" class="text-start ps-3 mb-0 text-white">
            <li>Loading...</li>
        </ol>
    </div>

    <button id="restart-button" class="btn btn-success fw-bold px-4 py-2" style="font-family: 'Press Start 2P'; font-size: 0.7em;">Play Again</button>
</div>
    </div>

    <script src="../../bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="snake.js"></script>
</body>
</html>
