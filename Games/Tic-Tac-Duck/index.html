<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quacky | Tic-Tac-Duck</title>
    <!-- Use relative path for CSS -->
    <link rel="stylesheet" href="tic-tac.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%234fc3f7' stroke='%23ffffff' stroke-width='3'/><circle cx='32' cy='34' r='16' fill='%23FFD700'/><path d='M 46 32 C 52 32, 54 35, 46 38 Z' fill='%23FF8C00'/><circle cx='38' cy='28' r='2.5' fill='%23000000'/><circle cx='39' cy='27' r='0.8' fill='%23ffffff'/></svg>">
</head>
<body>
    <!-- Quacky Header Script will inject here automatically -->
    
<div style="margin-bottom: 15px;">
    <button id="mode-toggle-btn" style="padding: 8px 16px; background-color: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 5px;">Switch to Online Mode</button>
    <button id="reset-room-btn" style="padding: 8px 16px; background-color: #9ca3af; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Reset Online Room</button>
</div>
    <div class="game-container">
        <h1>Tic-Tac-Duck 🦆</h1>
        <!-- Match initial state to the duck player -->
        <h2 id="status">Player 🦆's Turn</h2>
        
        <div id="board" class="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="reset-btn">Restart Game</button>
    </div>

    <!-- REQUIRED: Firebase Compat SDK Scripts so database initialization works -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- Use relative paths for local JS files so they load reliably -->
    <script src="/QuackyTitle.js"></script>
    <script src="tic-tac.js"></script>
</body>
</html>
